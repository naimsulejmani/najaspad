spring.application.name=najaspad

# Use an in-memory DB and keep it open while the JVM runs (so H2 console sees it)
spring.datasource.url=jdbc:h2:mem:najaspad;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# allow connections from other hosts (use with care)
spring.h2.console.settings.web-allow-others=true
# optional: require the same credentials as datasource (set in login form)
spring.h2.console.settings.password=sa

# relaxed Tomcat characters (optional; helps if upstream proxy sends extra chars)
server.tomcat.relaxed-path-chars=|
server.tomcat.relaxed-query-chars=|
