# Production Configuration for Najaspad
spring.application.name=najaspad

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/najaspad}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:najaspad}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:najaspad_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Disable H2 Console in production
spring.h2.console.enabled=false

# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging
logging.level.root=INFO
logging.level.dev.naimsulejmani.najaspad=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator (for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

