# Production Configuration for Najaspad
spring.application.name=najaspad

# Database Configuration (H2 file-based for simple/free deployments)
# Default to a writable location for distroless nonroot user.
# NOTE: On Render free tier the filesystem is ephemeral, so data may reset on redeploy.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/tmp/najaspad;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (enabled by default here for testing; disable later if public)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Server Configuration
# Render provides PORT; default to 8080 for local runs
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging
logging.level.root=INFO
logging.level.dev.naimsulejmani.najaspad=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator (for health checks)
management.endpoints.web.exposure.include=health
# Render can only call health endpoints unauthenticated; keep details minimal
management.endpoint.health.show-details=never
